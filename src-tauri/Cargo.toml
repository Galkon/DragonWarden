[package]
name = "dragonwarden"
version = "0.1.1"
description = "A safe RuneScape: Dragonwilds dedicated server manager"
authors = ["DragonWarden contributors"]
edition = "2021"

[lib]
name = "dragonwarden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
zip = "2"
chrono = { version = "0.4", features = ["clock"] }
